version: "3.9"

services:
  db:
    image: postgres:15.1-alpine
    container_name: postgres
    restart: on-failure
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    ports:
     - "${POSTGRES_PORT}:5432"
    healthcheck:
       test: [ "CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}" ]
       interval: 5s
       timeout: 10s
       retries: 5
       start_period: 10s

  redis:
    image: redis:7.2-alpine
    container_name: redis
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: [ "CMD", "cache-cli", "ping" ]
      interval: 5s
      timeout: 10s
      retries: 5

  celery:
    container_name: celery
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
        - .env
    environment:
      POSTGRES_HOST: db
      REDIS_SERVER: redis
    command: celery --app=tasks:app_celery worker --loglevel=INFO
    depends_on:
      - db
      - redis
    links:
      - redis

  celery-beat:
      container_name: celery_beat
      build:
        context: .
        dockerfile: Dockerfile
      env_file:
        - .env
      environment:
        REDIS_SERVER: redis
      command: celery --app=tasks:app_celery beat --loglevel=INFO
      depends_on:
        - db
        - redis
      links:
        - celery
        - redis

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastapi
    restart: on-failure
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
    ports:
      - "8000:8000"
    depends_on:
      - db
    entrypoint: uvicorn main:app --reload --workers 1 --host 0.0.0.0 --port 8000


networks:
  default:
      name: lan_derebit
