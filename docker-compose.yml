version: "3.9"

services:
  db:
    image: postgres:15.1-alpine
    container_name: postgres
    restart: on-failure
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
#    ports:
#      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}" ]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7.2-alpine
    container_name: redis
#    ports:
#      - "${REDIS_PORT}:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 10s
      retries: 5

  celery:
    container_name: celery
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_DSN: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      REDIS_DSN: "redis://redis:6379/0"
    command: celery --app=tasks:app_celery worker --loglevel=INFO
    depends_on:
      - app_prepare
      - db
      - redis
    links:
      - redis

  celery-beat:
    container_name: celery_beat
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_DSN: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      REDIS_DSN: "redis://redis:6379/0"
    command: celery --app=tasks:app_celery beat --loglevel=INFO
    depends_on:
      - app_prepare
      - db
      - redis
    links:
      - celery
      - redis

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastapi
    restart: on-failure
    env_file:
      - .env
    environment:
      DATABASE_DSN: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      REDIS_DSN: "redis://redis:6379/0"
    ports:
      - "8000:8000"
    depends_on:
      - app_prepare
      - db
    entrypoint: uvicorn api:app --workers 1 --host 0.0.0.0 --port 8000

  app_prepare:
    build:
      context: .
      dockerfile: Dockerfile
    restart: no
    depends_on:
      db:
        condition: service_healthy
    command: yoyo apply --batch -v /app/migrations -d "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
    # command: sleep infinity

networks:
  default:
    name: lan_derebit
